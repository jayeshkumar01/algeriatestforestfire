<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run a Prediction — FWI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f2;
    --panel:#ffffff;
    --ink:#1b1c19;
    --muted:#5f6259;
    --line:#dcdad3;
    --accent:#a34321;
    --accent-soft:#f2e6de;
    --sage:#556b53;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:760px;margin:0 auto;padding:0 32px 80px;}

  nav.top{border-bottom:1px solid var(--line);margin-bottom:36px;}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 0;}
  .brand{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;}
  .brand .dot{width:8px;height:8px;background:var(--accent);border-radius:1px;}
  .back{
    font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;
    border:1px solid var(--line);padding:8px 14px;border-radius:4px;
  }
  .back:hover{color:var(--ink);border-color:var(--ink);}
  .back svg{width:13px;height:13px;}

  .label{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--sage);margin-bottom:14px;
  }
  h1{font-weight:500;font-size:clamp(26px,3.6vw,34px);line-height:1.2;margin:0 0 14px;}
  .lede{color:var(--muted);font-size:15px;line-height:1.6;max-width:520px;margin-bottom:32px;}

  .result-line{
    font-size:15.5px;color:var(--ink);margin:0 0 28px;
    padding-bottom:20px;border-bottom:1px solid var(--line);
  }
  .result-line span{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--accent);}

  form{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:32px;}
  .group-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin:0 0 14px;
    padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .group-label.spaced{margin-top:26px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;}
  .field label b{color:var(--ink);font-weight:500;}
  input, select{
    width:100%;background:#fbfaf8;border:1px solid var(--line);color:var(--ink);
    font-family:'IBM Plex Mono',monospace;font-size:14px;padding:11px 13px;border-radius:5px;
  }
  input::placeholder{color:#9a9d93;}
  input:focus, select:focus{outline:none;border-color:var(--accent);}
  select{
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f6259' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 13px center;background-size:15px;padding-right:36px;
  }

  .submit{
    width:100%;margin-top:10px;font-weight:600;font-size:14.5px;color:#fff;
    background:var(--ink);border:none;padding:14px;border-radius:5px;cursor:pointer;
  }
  .submit:hover{background:#000;}

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  @media (max-width:560px){.grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="top">
    <div class="nav-inner">
      <div class="brand"><span class="dot"></span> Fire Weather Index Estimator</div>
      <a class="back" href="{{ url_for('home') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
        Home
      </a>
    </div>
  </nav>

  <div class="label">New prediction</div>
  <h1>Enter today's field readings</h1>
  <p class="lede">Fill in the values below. Inputs are standardized automatically before the model scores the Fire Weather Index.</p>

  <p class="result-line">Predicted Fire Weather Index: <span>{{ result }}</span></p>

  <form action="{{ url_for('predict_data') }}" method="post">

    <p class="group-label">Weather readings</p>
    <div class="grid2">
      <div class="field">
        <label for="Temperature">Temperature <b>(°C)</b></label>
        <input type="text" id="Temperature" name="Temperature" placeholder="e.g. 32" required>
      </div>
      <div class="field">
        <label for="RH">Relative Humidity <b>(%)</b></label>
        <input type="text" id="RH" name="RH" placeholder="e.g. 45" required>
      </div>
      <div class="field">
        <label for="Ws">Wind Speed <b>(km/h)</b></label>
        <input type="text" id="Ws" name="Ws" placeholder="e.g. 15" required>
      </div>
      <div class="field">
        <label for="Rain">Rain <b>(mm)</b></label>
        <input type="text" id="Rain" name="Rain" placeholder="e.g. 0" required>
      </div>
    </div>

    <p class="group-label spaced">Fuel moisture &amp; spread codes</p>
    <div class="grid2">
      <div class="field">
        <label for="FFMC">Fine Fuel Moisture Code</label>
        <input type="text" id="FFMC" name="FFMC" placeholder="e.g. 84.5" required>
      </div>
      <div class="field">
        <label for="DMC">Duff Moisture Code</label>
        <input type="text" id="DMC" name="DMC" placeholder="e.g. 20.1" required>
      </div>
      <div class="field">
        <label for="ISI">Initial Spread Index</label>
        <input type="text" id="ISI" name="ISI" placeholder="e.g. 5.2" required>
      </div>
    </div>

    <p class="group-label spaced">Context</p>
    <div class="grid2">
      <div class="field">
        <label for="Classes">Fire Class</label>
        <select id="Classes" name="Classes" required>
          <option value="" disabled selected>Select…</option>
          <option value="0">Not fire</option>
          <option value="1">Fire</option>
        </select>
      </div>
      <div class="field">
        <label for="Region">Region</label>
        <select id="Region" name="Region" required>
          <option value="" disabled selected>Select…</option>
          <option value="0">Bejaia</option>
          <option value="1">Sidi Bel-abbes</option>
        </select>
      </div>
    </div>

    <button type="submit" class="submit">Predict FWI</button>
  </form>
</div>
</body>
</html>
